<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard da Empresa - Milla's Free</title>
    <link rel="icon" type="image/png" href="../imagens/milasclock.png" sizes="any">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        }
    </script>
    <script>
        // Previne o "flash" do tema incorreto (FOUC)
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-main">

    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="landing.html" class="sidebar-header">
                <img src="../imagens/millasfull.png" alt="Milla's Free Logo" class="sidebar-logo block dark:hidden">
                <img src="../imagens/millas_escuro.png" alt="Milla's Free Logo" class="sidebar-logo-dark hidden dark:block">
            </a>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="index.html"><i class="fas fa-tachometer-alt"></i> <span>Painel</span></a></li>
                    <li><a href="company-dashboard.html" class="active"><i class="fas fa-users"></i> <span>Membros</span></a></li>
                    <li><a href="demands.html"><i class="fas fa-tasks"></i> <span>Demandas</span></a></li>
                    <li><a href="reports.html"><i class="fas fa-chart-pie"></i> <span>Relatórios</span></a></li>
                    <li><a href="settings.html"><i class="fas fa-cog"></i> <span>Configurações</span></a></li>
                    <li class="hidden"><a href="profile.html"><i class="fas fa-user-clock"></i> <span>Meu Painel</span></a></li>
                </ul>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <div class="main-content">
            <header class="main-header">
                <!-- O campo de busca foi movido para o card de gerenciamento de colaboradores -->
                <div class="header-actions">
                    <button id="theme-toggle" aria-label="Alternar tema" class="theme-toggle-btn">
                        <i class="fas fa-sun"></i>
                    </button>
                    <div id="profile-toggle" class="relative">
                        <button title="Configurações" class="profile-pic"></button>
                    </div>
                </div>
            </header>

            <main>
                <h1 class="text-3xl font-bold mb-6">Dashboard da Empresa</h1>
                <div class="card mb-10">
                    <div class="flex justify-between items-center mb-4 flex-wrap gap-4">
                        <div>
                            <h2 class="text-xl font-semibold">Gerenciar Colaboradores</h2>
                            <p id="company-email-display" class="text-sm text-secondary"></p>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                    <i class="fas fa-search text-secondary"></i>
                                </div>
                                <input type="search" id="search-member-input" placeholder="Buscar colaborador..." class="w-64 p-3 search-input">
                            </div>
                            <button id="add-member-button" class="btn btn-success">
                                <i class="fas fa-plus"></i> Adicionar
                            </button>
                        </div>
                    </div>

                    <!-- Members List -->
                    <div class="data-table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th class="font-bold text-gray-300">Colaborador</th>
                                    <th class="text-right font-bold text-gray-300">Ações</th>
                                </tr>
                            </thead>
                            <tbody id="members-list">
                                <!-- Skeleton Loader -->
                                <tr class="skeleton-row">
                                    <td colspan="3">
                                        <div class="flex items-center justify-between">
                                            <div class="space-y-2">
                                                <div class="skeleton skeleton-text w-32"></div>
                                                <div class="skeleton skeleton-text-sm w-48"></div>
                                            </div>
                                            <div class="skeleton skeleton-text w-24 h-8"></div>
                                        </div>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                    <!-- Members Pagination -->
                    <div id="members-pagination-controls" class="flex justify-center items-center space-x-4 mt-6 hidden">
                        <button id="prev-members-page-button" class="btn btn-secondary">Anterior</button>
                        <button id="next-members-page-button" class="btn btn-primary">Próxima</button>
                    </div>
                </div>

            </main>
        </div>
    </div>

    <!-- Modals Container -->
    <div id="modals-container">
        <!-- Overlay da Página (usado com modais) -->
        <div id="page-overlay" class="fixed inset-0 bg-black bg-opacity-20 hidden z-30"></div>        

        <!-- Modal de Adicionar Colaborador -->
        <div id="create-member-modal" class="fixed inset-0 modal-backdrop flex items-center justify-center hidden z-50">
            <div class="card p-6 rounded-xl shadow-xl w-full max-w-sm">
                <h3 class="text-xl font-bold mb-4">Adicionar Novo Colaborador</h3>
                <form id="create-member-form">
                    <div class="mb-4">
                        <label for="member-name" class="block text-sm font-medium mb-1">Nome</label>
                        <input id="member-name" type="text" required class="w-full p-2">
                    </div>
                    <div class="mb-6">
                        <label for="member-email" class="block text-sm font-medium mb-1">Email</label>
                        <input id="member-email" type="email" required class="w-full p-2">
                    </div>
                    <div class="flex justify-end space-x-4">
                        <button type="button" id="cancel-create-member-button" class="btn btn-secondary">Cancelar</button>
                        <button type="submit" id="submit-create-member" class="btn btn-primary w-48 text-center">
                            <span class="button-text">Adicionar Colaborador</span>
                            <i class="fas fa-spinner fa-spin hidden button-spinner"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Modal de Editar Colaborador -->
        <div id="edit-member-modal" class="fixed inset-0 modal-backdrop flex items-center justify-center hidden z-50">
            <div class="card p-6 rounded-xl shadow-xl w-full max-w-sm">
                <h3 class="text-xl font-bold mb-4">Editar Colaborador</h3>
                <form id="edit-member-form">
                    <input type="hidden" id="edit-member-id">
                    <div class="mb-4">
                        <label for="edit-member-name" class="block text-sm font-medium mb-1">Nome</label>
                        <input id="edit-member-name" type="text" required class="w-full p-2">
                    </div>
                    <div class="mb-6">
                        <label for="edit-member-email" class="block text-sm font-medium mb-1">Email</label>
                        <input id="edit-member-email" type="email" required class="w-full p-2">
                    </div>
                    <div class="flex justify-end space-x-4">
                        <button type="button" id="cancel-edit-member-button" class="btn btn-secondary">Cancelar</button>
                        <button type="submit" id="save-edit-member-button" class="btn btn-primary w-24 text-center">
                            <span class="button-text">Salvar</span>
                            <i class="fas fa-spinner fa-spin hidden button-spinner"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Modal de Perfil (Reutilizável) -->
        <div id="profile-modal" class="dropdown-menu hidden z-40 !right-8 !top-[70px]">
            <div class="card p-4 w-full max-w-xs">
                <div id="user-view" class="space-y-3">
                    <div class="text-sm">
                        <p class="font-semibold" id="user-email-display">carregando...</p>
                        <div id="verification-status" class="text-xs mt-1"></div>
                    </div>
                    <hr class="border-border-color">
                    <a href="settings.html" class="block text-sm hover:text-primary"><i class="fas fa-cog w-6"></i> Configurações</a>
                    <a href="#" id="logout-button" class="block text-sm hover:text-primary"><i class="fas fa-sign-out-alt w-6"></i> Sair</a>
                </div>
            </div>
        </div>

        <!-- Modal de Mensagem -->
        <div id="message-modal" class="fixed inset-0 modal-backdrop flex items-center justify-center hidden z-50 p-4">
            <div class="card p-6 rounded-xl shadow-xl w-full max-w-sm text-center">
                <p id="message-text" class="text-lg font-semibold mb-4"></p>
                <div id="message-buttons" class="flex justify-center space-x-4">
                    <button id="message-ok" class="btn btn-primary">OK</button>
                    <button id="message-cancel" class="btn btn-secondary hidden">Cancelar</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../js/company-dashboard.js"></script>
</body>
</html>
