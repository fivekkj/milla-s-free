<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Relatórios - Milla's Free</title>
    <link rel="icon" href="../imagens/millasclock.png" type="image/png" sizes="any">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' }
    </script>
    <script>
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../css/styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="dashboard-content" class="dashboard-container hidden">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="landing.html" class="sidebar-header">
                <img src="../imagens/millasfull.png" alt="Milla's Free Logo" class="sidebar-logo block dark:hidden">
                <img src="../imagens/millas_escuro.png" alt="Milla's Free Logo" class="sidebar-logo-dark hidden dark:block">
            </a>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="profile.html"><i class="fas fa-user-clock"></i> <span>Meu Painel</span></a></li>
                    <li><a href="member-demands.html"><i class="fas fa-tasks"></i> <span>Demandas</span></a></li>
                    <li><a href="member-reports.html" class="active"><i class="fas fa-chart-pie"></i> <span>Meus Relatórios</span></a></li>
                </ul>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <div class="main-content">
            <header class="main-header">
                <div class="header-actions">
                    <button id="theme-toggle" aria-label="Alternar tema" class="theme-toggle-btn">
                        <i class="fas fa-sun"></i>
                    </button>
                    <div id="profile-toggle" class="relative">
                        <button title="Configurações" class="profile-pic"></button>
                    </div>
                </div>
            </header>

            <main>
                <h1 class="text-2xl font-bold mb-6">Meus Relatórios de Horas</h1>

                <div class="card">
                    <h2 class="text-xl font-semibold mb-4">Distribuição de Horas por Projeto</h2>
                    <div id="chart-container" class="h-96 flex items-center justify-center">
                        <canvas id="member-hours-chart"></canvas>
                        <p id="no-data-message" class="text-secondary hidden">Você ainda não registrou nenhuma hora.</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Container para modais -->
    <div id="modals-container">
        <div id="profile-modal" class="dropdown-menu hidden z-40 !right-8 !top-[70px]">
            <div class="card p-4 w-full max-w-xs">
                <div id="user-view" class="space-y-3">
                    <div class="text-sm">
                        <p class="font-semibold" id="user-email-display">carregando...</p>
                    </div>
                    <hr class="border-border-color">
                    <a href="#" id="logout-button" class="block text-sm hover:text-primary"><i class="fas fa-sign-out-alt w-6"></i> Sair</a>
                </div>
            </div>
        </div>

        <div id="message-modal" class="fixed inset-0 modal-backdrop flex items-center justify-center hidden z-50 p-4">
            <div class="card p-6 w-full max-w-sm text-center">
                <p id="message-text" class="text-lg font-semibold mb-4"></p>
                <button id="message-ok" class="btn btn-primary">OK</button>
            </div>
        </div>
    </div>

    <script type="module" src="../js/member-reports.js"></script>
</body>
</html>
